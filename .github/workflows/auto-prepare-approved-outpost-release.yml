name: Auto-prepare verified OutPOSt release PR

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/auto-prepare-approved-outpost-release.yml'
  workflow_run:
    workflows:
      - 'Import verified OutPOSt installer from Dropbox'
    types: [completed]

permissions:
  contents: read

concurrency:
  group: outpost-auto-prepare-approved-release
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'MorvuddEzkaton/outpost-public-site' &&
      vars.OUTPOST_RELEASE_PREPARATION_ENABLED == '1' &&
      github.actor == 'MorvuddEzkaton' &&
      (github.event_name == 'push' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'staging'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Strictly validate complete staging before executing it
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main staging --prune
          MAIN_SHA=$(git rev-parse origin/main)
          STAGING_SHA=$(git rev-parse origin/staging)
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          git merge-base --is-ancestor "$MAIN_SHA" "$STAGING_SHA"
          test "$MAIN_SHA" != "$STAGING_SHA"
          mapfile -t receipt_paths < <(git diff --name-only "$MAIN_SHA" "$STAGING_SHA" | grep -E '^release/evidence/outpost-v[0-9]+\.[0-9]+\.[0-9]+\.json$')
          test "${#receipt_paths[@]}" -eq 1
          VERSION="${receipt_paths[0]#release/evidence/outpost-v}"
          VERSION="${VERSION%.json}"
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          expected_exe="site/downloads/OutPOSt-Setup-v${VERSION}.exe"
          expected_sha="site/downloads/OutPOSt-Setup-v${VERSION}.sha256.txt"
          expected_evidence="release/evidence/outpost-v${VERSION}.json"
          mapfile -t changes < <(git diff --name-status "$MAIN_SHA" "$STAGING_SHA")
          test "${#changes[@]}" -eq 4
          for entry in "${changes[@]}"; do
            case "$entry" in
              $'M\t'site/changelog.html|$'A\t'"$expected_exe"|$'A\t'"$expected_sha"|$'A\t'"$expected_evidence") ;;
              *) echo 'Unexpected release-input diff: blocked' >&2; exit 1 ;;
            esac
          done
          for expected in "site/changelog.html" "$expected_exe" "$expected_sha" "$expected_evidence"; do
            test "$(printf '%s\n' "${changes[@]}" | cut -f2 | grep -Fxc "$expected")" -eq 1
          done
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "staging_sha=$STAGING_SHA" >> "$GITHUB_OUTPUT"
          git switch --detach "$STAGING_SHA"
      - name: Validate and dry-run existing trusted updater
        env:
          VERSION: ${{ steps.scope.outputs.version }}
        run: python scripts/prepare_public_release.py "$VERSION"
      - name: Prepare release branch using canonical updater
        env:
          VERSION: ${{ steps.scope.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "codex/release/v${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/prepare_public_release.py "$VERSION" --apply
      - name: Enforce generated public allowlist and static integrity gates
        env:
          MAIN_SHA: ${{ steps.scope.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS=$'\t' read -r status path extra; do
            [ -n "$status" ] || continue
            [[ "$status" != R* && "$status" != C* && "$status" != D* ]] || exit 1
            case "$path" in
              site/*.html|site/sitemap.xml|release/artifact-registry.json|release/evidence/outpost-v*.json|site/downloads/OutPOSt-Setup-v*.exe|site/downloads/OutPOSt-Setup-v*.sha256.txt) ;;
              *) echo 'Generated changes escaped the allowlist' >&2; exit 1 ;;
            esac
          done < <(git diff --name-status "$MAIN_SHA")
          for protected in site/_worker.js site/_telegram-support.js site/_telegram-faq.js site/_headers wrangler.jsonc; do
            git diff --quiet "$MAIN_SHA" -- "$protected" || exit 1
          done
          python scripts/release_integrity.py --base-ref origin/main
          python scripts/verify_installers.py
          python scripts/verify_public_site.py
          python scripts/verify_public_seo_uniqueness.py
          python scripts/verify_release_metadata.py
          python scripts/verify_release_sitemap.py
          python scripts/verify_prepare_release_workflow.py
          python scripts/verify_release_gate_parity.py
          python scripts/test_release_integrity.py
          git diff --check
      - name: Commit generated metadata, push isolated branch, create reviewable PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.scope.outputs.version }}
          MAIN_SHA: ${{ steps.scope.outputs.main_sha }}
          STAGING_SHA: ${{ steps.scope.outputs.staging_sha }}
        run: |
          set -euo pipefail
          git add site/*.html site/sitemap.xml release/artifact-registry.json
          git diff --cached --quiet && { echo 'No release metadata generated' >&2; exit 1; }
          git commit -m "Prepare public release v${VERSION} after verified Dropbox import"
          git fetch origin main staging --prune
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse origin/staging)" = "$STAGING_SHA"
          BRANCH=$(git branch --show-current)
          git push origin "HEAD:refs/heads/${BRANCH}"
          gh pr create --base main --head "$BRANCH" --title "Release OutPOSt v${VERSION}" --body "Prepared from exact staging SHA ${STAGING_SHA}, trusted main ${MAIN_SHA}. All four input files were scope-checked; SHA and owner Windows report checked via canonical release tooling. Review required. Does not merge, deploy, or send notifications."
