name: Browser keyboard guard

on:
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-keyboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install pinned Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0

      - name: Install Chromium for keyboard checks
        run: npx playwright install --with-deps chromium

      - name: Run keyboard navigation guard
        run: npx playwright test scripts/browser_keyboard.spec.mjs --reporter=line --workers=1

      - name: Upload keyboard failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # actions/upload-artifact@v4
        with:
          name: browser-keyboard-failures-${{ github.run_id }}
          path: browser-keyboard-artifacts/
          if-no-files-found: ignore
          retention-days: 7
