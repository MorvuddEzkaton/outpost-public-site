name: Protected public production publication

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never interrupt an upload/rollback to replace it with another commit.
concurrency:
  group: outpost-production-writer
  cancel-in-progress: false

jobs:
  static-quality:
    if: >-
      vars.OUTPOST_PRODUCTION_DEPLOYMENT_ENABLED == '1' &&
      vars.OUTPOST_PRODUCTION_WRITER_ENABLED == '1' &&
      github.repository == 'MorvuddEzkaton/outpost-public-site' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && github.actor == github.repository_owner))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install existing pinned image decoder
        run: python -m pip install Pillow==12.3.0
      - name: Complete credential-free source quality
        run: python scripts/run_production_quality.py
      - name: Scan source and short public history with the existing verified scanner
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/outpost-gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/outpost-gitleaks"
          "$RUNNER_TEMP/outpost-gitleaks/gitleaks" dir . --config .gitleaks.toml --redact=100 --no-banner --no-color --ignore-gitleaks-allow
          "$RUNNER_TEMP/outpost-gitleaks/gitleaks" git . --config .gitleaks.toml --redact=100 --no-banner --no-color --ignore-gitleaks-allow

  browser-quality:
    needs: static-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - run: npm install --no-save --no-package-lock @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test scripts/browser_a11y.spec.mjs --reporter=line --workers=1
      - run: npx playwright test scripts/browser_keyboard.spec.mjs --reporter=line --workers=1
      - run: npx playwright test scripts/browser_runtime.spec.mjs --reporter=line --workers=1
      - run: npx playwright test scripts/browser_ui.spec.mjs --reporter=line --workers=1

  publish:
    needs: [static-quality, browser-quality]
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    env:
      OUTPOST_PRODUCTION_DEPLOYMENT_ENABLED: ${{ vars.OUTPOST_PRODUCTION_DEPLOYMENT_ENABLED }}
      OUTPOST_PRODUCTION_WRITER_ENABLED: ${{ vars.OUTPOST_PRODUCTION_WRITER_ENABLED }}
      OUTPOST_PRODUCTION_ROLLBACK_ENABLED: ${{ vars.OUTPOST_PRODUCTION_ROLLBACK_ENABLED }}
      OUTPOST_AUTOMATIC_PRODUCTION_APPROVAL_ENABLED: ${{ vars.OUTPOST_AUTOMATIC_PRODUCTION_APPROVAL_ENABLED }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install pinned publisher tool without lifecycle scripts or credentials
        run: |
          mkdir "$RUNNER_TEMP/outpost-publisher-tools"
          cp scripts/publisher-tools/package.json scripts/publisher-tools/package-lock.json "$RUNNER_TEMP/outpost-publisher-tools/"
          npm ci --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/outpost-publisher-tools"
      - name: Verify Telegram transport in the actual offline edge runtime
        # Miniflare/workerd may create ephemeral files relative to cwd; keep them outside checked-out Git sources.
        working-directory: ${{ runner.temp }}
        env:
          OUTPOST_WRANGLER_JS: ${{ runner.temp }}/outpost-publisher-tools/node_modules/wrangler/bin/wrangler.js
        run: node ${{ github.workspace }}/scripts/test_telegram_transport_workerd.mjs
      - name: Assert publisher checkout is clean before deployment plan
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo 'Publisher prerequisites dirtied the reviewed checkout:' >&2
            git status --short >&2
            exit 1
          fi
      - name: Prepare read-only deployment plan
        id: plan
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.OUTPOST_PAGES_DEPLOY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/production_publisher.py plan --journal "$RUNNER_TEMP/outpost-production-journal.json"
      - name: Persist intent before any upload
        id: intent
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: outpost-production-intent-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/outpost-production-journal.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload once and require actual matching canonical deployment
        id: upload
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.OUTPOST_PAGES_DEPLOY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          OUTPOST_SAVED_PLAN_URL: ${{ steps.intent.outputs.artifact-url }}
          OUTPOST_WRANGLER_JS: ${{ runner.temp }}/outpost-publisher-tools/node_modules/wrangler/bin/wrangler.js
        run: python scripts/production_publisher.py execute --journal "$RUNNER_TEMP/outpost-production-journal.json" --package "$RUNNER_TEMP/outpost-production-upload"
      - name: Verify all live contracts only after exact deployment proof
        id: live
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.OUTPOST_PAGES_DEPLOY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/production_publisher.py verify-live --journal "$RUNNER_TEMP/outpost-production-journal.json"
      - name: Restore only our saved code after a critical live failure
        if: ${{ failure() && steps.live.outcome == 'failure' && vars.OUTPOST_PRODUCTION_ROLLBACK_ENABLED == '1' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.OUTPOST_PAGES_DEPLOY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/production_publisher.py rollback --journal "$RUNNER_TEMP/outpost-production-journal.json"
      - name: Save final journal even on failure; never upload credentials or raw logs
        id: result
        if: ${{ always() && steps.plan.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: outpost-production-result-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/outpost-production-journal.json
          if-no-files-found: error
          retention-days: 90
      - name: Confirm future releases only after accepted live publication
        if: >-
          success() && github.event_name == 'push' &&
          steps.live.outcome == 'success' && steps.result.outcome == 'success' &&
          vars.OUTPOST_AUTOMATIC_RELEASE_CONFIRMATION_ENABLED == '1' &&
          vars.OUTPOST_RELEASE_DELIVERY_MODE == 'subscribers'
        env:
          OUTPOST_AUTOMATIC_RELEASE_CONFIRMATION_ENABLED: ${{ vars.OUTPOST_AUTOMATIC_RELEASE_CONFIRMATION_ENABLED }}
          OUTPOST_RELEASE_DELIVERY_MODE: ${{ vars.OUTPOST_RELEASE_DELIVERY_MODE }}
          OUTPOST_SAVED_RESULT_URL: ${{ steps.result.outputs.artifact-url }}
          OUTPOST_RELEASE_CONFIRM_KEY: ${{ secrets.OUTPOST_RELEASE_CONFIRM_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.OUTPOST_PAGES_DEPLOY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/confirm_published_releases.py --journal "$RUNNER_TEMP/outpost-production-journal.json" --apply
