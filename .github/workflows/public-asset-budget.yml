name: Public asset budget

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "site/**"
      - "!site/downloads/**"
      - "scripts/verify_public_asset_budget.py"
      - ".github/workflows/public-asset-budget.yml"
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-asset-budget:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Guard public front-end asset budget
        run: python scripts/verify_public_asset_budget.py
