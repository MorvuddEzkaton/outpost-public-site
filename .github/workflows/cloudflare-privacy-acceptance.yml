name: Cloudflare privacy acceptance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/verify_live_cloudflare_privacy.py"
      - "scripts/test_live_cloudflare_privacy.py"
      - ".github/workflows/cloudflare-privacy-acceptance.yml"
  push:
    branches:
      - staging
    paths:
      - "scripts/verify_live_cloudflare_privacy.py"
      - "scripts/test_live_cloudflare_privacy.py"
      - ".github/workflows/cloudflare-privacy-acceptance.yml"

permissions:
  contents: read

concurrency:
  group: outpost-cloudflare-privacy-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-cloudflare-privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test Cloudflare privacy verifier offline
        run: python scripts/test_live_cloudflare_privacy.py

      - name: Compile Cloudflare privacy verifier
        run: python -m py_compile scripts/verify_live_cloudflare_privacy.py scripts/test_live_cloudflare_privacy.py

      - name: Verify production has no Cloudflare RUM injection
        if: github.event_name == 'workflow_dispatch'
        env:
          OUTPOST_LIVE_CLOUDFLARE_PRIVACY_ATTEMPTS: "6"
          OUTPOST_LIVE_CLOUDFLARE_PRIVACY_DELAY_SECONDS: "5"
        run: python scripts/verify_live_cloudflare_privacy.py
