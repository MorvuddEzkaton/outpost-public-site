name: Host normalization acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outpost-host-normalization-acceptance
  cancel-in-progress: true

jobs:
  verify-host-normalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test host-normalization verifier offline
        run: python scripts/test_live_host_normalization.py

      - name: Compile host-normalization verifier
        run: python -m py_compile scripts/verify_live_host_normalization.py scripts/test_live_host_normalization.py

      - name: Verify alternate production hosts
        env:
          OUTPOST_LIVE_HOST_NORMALIZATION_ATTEMPTS: "6"
          OUTPOST_LIVE_HOST_NORMALIZATION_DELAY_SECONDS: "5"
          OUTPOST_LIVE_HOST_NORMALIZATION_WORKERS: "8"
        run: python scripts/verify_live_host_normalization.py
