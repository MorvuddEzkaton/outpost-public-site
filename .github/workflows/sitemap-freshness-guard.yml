name: Sitemap lastmod freshness guard

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "site/**/*.html"
      - "site/sitemap.xml"
      - "scripts/verify_sitemap_freshness.py"
      - "scripts/test_sitemap_freshness.py"
      - ".github/workflows/sitemap-freshness-guard.yml"

permissions:
  contents: read

concurrency:
  group: sitemap-lastmod-freshness-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-sitemap-freshness:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Test sitemap freshness logic offline
        run: python scripts/test_sitemap_freshness.py

      - name: Guard sitemap lastmod against HTML Git history
        run: python scripts/verify_sitemap_freshness.py

      - name: Compile sitemap freshness guard
        run: python -m py_compile scripts/verify_sitemap_freshness.py scripts/test_sitemap_freshness.py
