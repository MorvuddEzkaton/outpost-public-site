name: Public repository security

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: public-source-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-source-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout public candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install pinned image decoder
        run: python -m pip install Pillow==12.3.0

      - name: Test security boundaries with synthetic negative cases
        run: python scripts/test_public_repository_security.py

      - name: Verify allowlisted files, reviewed images and exact installers
        run: python scripts/verify_public_repository_security.py

      - name: Validate immutable release history against the exact PR base
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/test_release_integrity.py
          if [ -n "$PR_BASE_SHA" ]; then
            python scripts/release_integrity.py --base-ref "$PR_BASE_SHA"
          else
            python scripts/release_integrity.py
          fi

      - name: Verify new publication checkpoints against provider evidence
        env:
          CHECKPOINT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/verify_production_checkpoints.py --check-new

      - name: Install checksum-verified portable secret scanner
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --location --silent --show-error 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' --output "$archive"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$archive" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/outpost-gitleaks"
          tar -xzf "$archive" -C "$RUNNER_TEMP/outpost-gitleaks"

      - name: Scan public source with full redaction
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/outpost-gitleaks/gitleaks" dir . --config .gitleaks.toml --redact=100 --no-banner --no-color --ignore-gitleaks-allow
          "$RUNNER_TEMP/outpost-gitleaks/gitleaks" git . --config .gitleaks.toml --redact=100 --no-banner --no-color --ignore-gitleaks-allow
