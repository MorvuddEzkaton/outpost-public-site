name: Diagnose public live contracts (read-only)

on:
  pull_request:
    paths:
      - 'scripts/diagnose_live_readonly.py'
      - '.github/workflows/live-contract-diagnostics.yml'
      - 'scripts/production_publisher.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-contracts:
    if: github.repository == 'MorvuddEzkaton/outpost-public-site'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Diagnose exact public-contract failures without using secrets
        # A PR may intentionally differ from production until published. Keep
        # these findings visible, but do not mistake pre-deploy drift for a
        # production acceptance gate. Manual diagnostics still fail on drift.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: python scripts/diagnose_live_readonly.py
