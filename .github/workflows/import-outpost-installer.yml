name: Import verified OutPOSt installer from Dropbox

on:
  push:
    branches:
      - staging
    paths:
      - '.github/workflows/import-outpost-installer.yml'
      - 'release/evidence/outpost-v*.json'
  workflow_dispatch:
    inputs:
      version:
        description: "Windows-approved OutPOSt version (X.Y.Z) already prepared in staging"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: outpost-installer-import
  cancel-in-progress: false

jobs:
  import-installer:
    if: github.repository == 'MorvuddEzkaton/outpost-public-site' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging') && github.actor == 'MorvuddEzkaton' && vars.OUTPOST_DROPBOX_IMPORT_ENABLED == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout only trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Assert release input scope BEFORE staging execution
        id: scope
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          git fetch origin main staging --prune
          if [ -z "$VERSION" ]; then
            mapfile -t receipt_paths < <(git diff --name-only origin/main origin/staging | grep -E '^release/evidence/outpost-v[0-9]+\.[0-9]+\.[0-9]+\.json$')
            test "${#receipt_paths[@]}" -eq 1
            VERSION="${receipt_paths[0]#release/evidence/outpost-v}"
            VERSION="${VERSION%.json}"
          fi
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          MAIN_SHA=$(git rev-parse origin/main)
          STAGING_SHA=$(git rev-parse origin/staging)
          test "$(git rev-parse HEAD)" = "$MAIN_SHA"
          git merge-base --is-ancestor "$MAIN_SHA" "$STAGING_SHA"
          test "$MAIN_SHA" != "$STAGING_SHA"
          expected_checksum="site/downloads/OutPOSt-Setup-v${VERSION}.sha256.txt"
          expected_evidence="release/evidence/outpost-v${VERSION}.json"
          mapfile -t changes < <(git diff --name-status "$MAIN_SHA" "$STAGING_SHA")
          test "${#changes[@]}" -eq 3
          for entry in "${changes[@]}"; do
            case "$entry" in
              $'M\t'site/changelog.html|$'A\t'"$expected_checksum"|$'A\t'"$expected_evidence") ;;
              *) echo 'Unexpected or unreviewed staging change: import blocked' >&2; exit 1 ;;
            esac
          done
          test "$(printf '%s\n' "${changes[@]}" | cut -f 2 | sort -u | wc -l)" -eq 3
          test "$(printf '%s\n' "${changes[@]}" | grep -c $'M\tsite/changelog.html')" -eq 1
          test "$(printf '%s\n' "${changes[@]}" | grep -c -F -x $'A\t'"$expected_checksum")" -eq 1
          test "$(printf '%s\n' "${changes[@]}" | grep -c -F -x $'A\t'"$expected_evidence")" -eq 1
          echo "main_sha=$MAIN_SHA" >> "$GITHUB_OUTPUT"
          echo "staging_sha=$STAGING_SHA" >> "$GITHUB_OUTPUT"
          git switch --detach "$STAGING_SHA"

      - name: Download and verify exact Windows-approved installer
        env:
          VERSION: ${{ steps.scope.outputs.version }}
          OUTPOST_DROPBOX_APP_KEY: ${{ secrets.OUTPOST_DROPBOX_APP_KEY }}
          OUTPOST_DROPBOX_APP_SECRET: ${{ secrets.OUTPOST_DROPBOX_APP_SECRET }}
          OUTPOST_DROPBOX_REFRESH_TOKEN: ${{ secrets.OUTPOST_DROPBOX_REFRESH_TOKEN }}
        run: python scripts/import_dropbox_installer.py "$VERSION"

      - name: Ensure exact four-input staging diff; push only staging
        env:
          VERSION: ${{ steps.scope.outputs.version }}
          MAIN_SHA: ${{ steps.scope.outputs.main_sha }}
          STAGING_SHA: ${{ steps.scope.outputs.staging_sha }}
        run: |
          set -euo pipefail
          python scripts/verify_prepare_release_workflow.py
          test "$(git rev-parse HEAD)" = "$STAGING_SHA"
          expected="site/downloads/OutPOSt-Setup-v${VERSION}.exe"
          test "$(git status --porcelain --untracked-files=all)" = "?? $expected"
          git add -- "$expected"
          test "$(git diff --cached --name-only)" = "$expected"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Stage verified OutPOSt v${VERSION} installer from Dropbox"
          git fetch origin main staging --prune
          test "$(git rev-parse origin/main)" = "$MAIN_SHA"
          test "$(git rev-parse origin/staging)" = "$STAGING_SHA"
          # Non-force push refuses races; no main/production/Cloudflare/Telegram mutation.
          git push origin HEAD:refs/heads/staging
